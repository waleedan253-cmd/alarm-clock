<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Alarm Clock - Fixed & Working</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #bc13fe;
            --bg-dark: #070913;
            --glass: rgba(16, 22, 42, 0.72);
            --border: rgba(0, 243, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Poppins', 'Noto Nastaliq Urdu', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 16px;
        }

        /* Animated Particle Canvas */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Main Glassmorphic Container */
        .ai-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 490px;
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 28px 24px;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.18), inset 0 0 20px rgba(188, 19, 254, 0.12);
            text-align: center;
        }

        /* AI Core Visualizer Ring */
        .ai-core-wrapper {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 14px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .ring-1 {
            width: 100%;
            height: 100%;
            border-top-color: var(--primary);
            border-bottom-color: var(--primary);
            animation: spin 4s linear infinite;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        .ring-2 {
            width: 78%;
            height: 78%;
            border-left-color: var(--secondary);
            border-right-color: var(--secondary);
            animation: spinReverse 3s linear infinite;
        }

        .ring-3 {
            width: 52%;
            height: 52%;
            background: radial-gradient(circle, var(--primary) 0%, var(--secondary) 100%);
            opacity: 0.85;
            animation: pulseCore 2s ease-in-out infinite;
            box-shadow: 0 0 25px var(--primary);
        }

        .ai-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 6px;
            text-shadow: 0 0 8px var(--primary);
        }

        /* Live Digital Clock */
        .clock-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, var(--primary), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(0, 243, 255, 0.35);
            margin-bottom: 4px;
        }

        .date-display {
            font-size: 0.82rem;
            color: #a0aec0;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* Form Inputs */
        .control-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .control-group label {
            display: block;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .row-inputs {
            display: flex;
            gap: 12px;
        }

        .row-inputs .control-group {
            flex: 1;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(10, 14, 28, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.35);
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 0.92rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.35);
        }

        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        /* Tone Selection with Preview Button */
        .tone-wrapper {
            display: flex;
            gap: 8px;
        }

        .btn-preview {
            padding: 0 12px;
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid var(--primary);
            border-radius: 12px;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-preview:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary);
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-set {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(188, 19, 254, 0.4);
        }

        .btn-set:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 243, 255, 0.6);
        }

        .btn-demo {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(188, 19, 254, 0.6);
            border-radius: 12px;
            background: rgba(188, 19, 254, 0.12);
            color: #e2b8ff;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-demo:hover {
            background: rgba(188, 19, 254, 0.3);
            color: #fff;
        }

        /* Active Alarm Status Badge */
        .status-card {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 14px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.45);
            display: none;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.4s ease;
        }

        .status-text {
            text-align: left;
            font-size: 0.85rem;
        }

        .status-text strong {
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
        }

        .countdown-tag {
            display: inline-block;
            margin-top: 3px;
            font-size: 0.75rem;
            color: #38bdf8;
        }

        .btn-cancel {
            background: rgba(255, 59, 92, 0.2);
            border: 1px solid #ff3b5c;
            color: #ff3b5c;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .btn-cancel:hover {
            background: #ff3b5c;
            color: #fff;
        }

        /* RINGING OVERLAY MODAL */
        .ring-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 18, 0.94);
            backdrop-filter: blur(22px);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            animation: alarmFlash 0.9s infinite alternate;
        }

        .ring-overlay.active {
            display: flex;
        }

        .ring-wave {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary), var(--secondary));
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            margin-bottom: 20px;
            box-shadow: 0 0 50px var(--primary);
            animation: shakeAndPulse 0.5s infinite alternate;
        }

        .ring-time {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary);
            margin-bottom: 10px;
        }

        .ring-message-box {
            max-width: 600px;
            width: 90%;
            background: rgba(255, 255, 255, 0.07);
            border: 2px solid var(--primary);
            border-radius: 20px;
            padding: 22px 26px;
            margin: 12px 0 26px;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.35);
        }

        .ring-user-tag {
            font-size: 0.85rem;
            color: var(--secondary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .ring-custom-msg {
            font-size: 1.7rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .btn-stop {
            padding: 16px 44px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(90deg, #ff3b5c, #ff7b00);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 59, 92, 0.75);
            transition: 0.3s;
        }

        .btn-stop:hover {
            transform: scale(1.06);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinReverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulseCore {
            0%, 100% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        @keyframes shakeAndPulse {
            0% { transform: scale(0.95) rotate(-6deg); }
            100% { transform: scale(1.1) rotate(6deg); }
        }
        @keyframes alarmFlash {
            0% { box-shadow: inset 0 0 40px rgba(0, 243, 255, 0.25); }
            100% { box-shadow: inset 0 0 90px rgba(188, 19, 254, 0.5); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .row-inputs { flex-direction: column; gap: 0; }
            .clock-display { font-size: 2rem; }
            .ring-time { font-size: 2.3rem; }
            .ring-custom-msg { font-size: 1.35rem; }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="ai-container">
        <div class="ai-core-wrapper">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
        </div>

        <div class="ai-badge">NEURAL AI CHRONO SYSTEM</div>
        <div class="clock-display" id="liveClock">00:00:00 AM</div>
        <div class="date-display" id="liveDate">Loading Date...</div>

        <!-- User Name & Custom Message Input -->
        <div class="control-group">
            <label for="userName">Student Name / Custom Message (نام یا پیغام):</label>
            <input type="text" id="userName" placeholder="e.g. Ali - Time for Math Study! / پڑھائی کا وقت">
        </div>

        <!-- Time & Tone Selection -->
        <div class="row-inputs">
            <div class="control-group">
                <label for="alarmTime">Set Time (وقت):</label>
                <input type="time" id="alarmTime">
            </div>

            <div class="control-group">
                <label for="alarmTone">Select AI Tone (ٹون):</label>
                <div class="tone-wrapper">
                    <select id="alarmTone">
                        <option value="ai_pulse">🤖 AI Pulse</option>
                        <option value="cyber_chime">✨ Cyber Chime</option>
                        <option value="study_bell">🔔 Study Bell</option>
                        <option value="digital_alert">⚡ Digital Alert</option>
                    </select>
                    <button type="button" class="btn-preview" id="previewBtn" title="Listen Tone">▶</button>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button type="button" class="btn-set" id="setAlarmBtn">ACTIVATE AI ALARM</button>
            <button type="button" class="btn-demo" id="testFullAlarmBtn">⚡ Test Full Alarm Popup & Voice Now</button>
        </div>

        <!-- Active Alarm Display -->
        <div class="status-card" id="statusCard">
            <div class="status-text">
                <div>Alarm Set For: <strong id="activeTimeText">--:--</strong></div>
                <div id="activeMsgPreview" style="color:#cbd5e1; font-size:0.78rem; margin-top:2px;"></div>
                <div class="countdown-tag" id="countdownText">Waiting for target time...</div>
            </div>
            <button type="button" class="btn-cancel" id="cancelAlarmBtn">Cancel</button>
        </div>
    </div>

    <!-- Fullscreen Ringing Alert Screen -->
    <div class="ring-overlay" id="ringOverlay">
        <div class="ring-wave">⏰</div>
        <div class="ring-time" id="ringTimeDisplay">00:00 AM</div>
        
        <div class="ring-message-box">
            <div class="ring-user-tag">⚡ AI PRIORITY NOTIFICATION ⚡</div>
            <div class="ring-custom-msg" id="ringMessageDisplay">Wake Up & Focus!</div>
        </div>

        <button type="button" class="btn-stop" id="stopAlarmBtn">DISMISS ALARM</button>
    </div>

    <script>
        /* =========================================
           1. AUDIO ENGINE (WEB AUDIO API)
           ========================================= */
        let audioCtx = null;
        let toneInterval = null;
        let speechInterval = null;

        function unlockAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTonePattern(toneType) {
            unlockAudio();
            const now = audioCtx.currentTime;

            if (toneType === 'ai_pulse') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.12);
                    gain.gain.setValueAtTime(0.3, now + i * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.12);
                    osc.stop(now + i * 0.12 + 0.36);
                });
            } 
            else if (toneType === 'cyber_chime') {
                [880, 1108.73, 1318.51, 1760].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.15);
                    gain.gain.setValueAtTime(0.35, now + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.5);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.15);
                    osc.stop(now + i * 0.15 + 0.52);
                });
            } 
            else if (toneType === 'study_bell') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now);
                gain.gain.setValueAtTime(0.45, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 1.25);
            } 
            else if (toneType === 'digital_alert') {
                [987.77, 987.77, 1318.51].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, now + i * 0.18);
                    gain.gain.setValueAtTime(0.2, now + i * 0.18);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.14);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.18);
                    osc.stop(now + i * 0.18 + 0.15);
                });
            }
        }

        /* =========================================
           2. RELIABLE CLOCK & ALARM TRIGGER LOGIC
           ========================================= */
        const liveClockEl = document.getElementById('liveClock');
        const liveDateEl = document.getElementById('liveDate');
        const alarmTimeInput = document.getElementById('alarmTime');
        const userNameInput = document.getElementById('userName');
        const alarmToneSelect = document.getElementById('alarmTone');
        const statusCard = document.getElementById('statusCard');
        const ringOverlay = document.getElementById('ringOverlay');

        let activeAlarm = null; // { hours: Number, minutes: Number, time24: String, message: String, tone: String, triggered: Boolean }
        let isRinging = false;

        // Pre-fill time input with current time + 1 minute for quick convenience
        function setDefaultNextMinute() {
            const now = new Date();
            now.setMinutes(now.getMinutes() + 1);
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            alarmTimeInput.value = `${hh}:${mm}`;
        }
        setDefaultNextMinute();

        function format12Hour(h24, m) {
            const ampm = h24 >= 12 ? 'PM' : 'AM';
            const h12 = h24 % 12 || 12;
            return `${String(h12).padStart(2, '0')}:${String(m).padStart(2, '0')} ${ampm}`;
        }

        function updateClock() {
            const now = new Date();
            const currentH = now.getHours();
            const currentM = now.getMinutes();
            const currentS = now.getSeconds();

            const ampm = currentH >= 12 ? 'PM' : 'AM';
            const displayH = String(currentH % 12 || 12).padStart(2, '0');
            const displayM = String(currentM).padStart(2, '0');
            const displayS = String(currentS).padStart(2, '0');

            liveClockEl.textContent = `${displayH}:${displayM}:${displayS} ${ampm}`;

            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            liveDateEl.textContent = now.toLocaleDateString('en-US', options);

            // Check Alarm Match (Triggers reliably anytime within the target minute!)
            if (activeAlarm && !activeAlarm.triggered && !isRinging) {
                if (currentH === activeAlarm.hours && currentM === activeAlarm.minutes) {
                    activeAlarm.triggered = true;
                    triggerAlarm(activeAlarm);
                } else {
                    // Update remaining time display
                    updateCountdown(now, activeAlarm.hours, activeAlarm.minutes);
                }
            }
        }

        function updateCountdown(now, targetH, targetM) {
            const target = new Date(now);
            target.setHours(targetH, targetM, 0, 0);
            if (target <= now) {
                target.setDate(target.getDate() + 1);
            }
            const diffSec = Math.floor((target - now) / 1000);
            const hrs = Math.floor(diffSec / 3600);
            const mins = Math.floor((diffSec % 3600) / 60);
            const secs = diffSec % 60;
            document.getElementById('countdownText').textContent = `Rings in: ${hrs}h ${mins}m ${secs}s`;
        }

        // Run check every 250ms so it NEVER skips a second
        setInterval(updateClock, 250);
        updateClock();

        /* =========================================
           3. BUTTON EVENT HANDLERS
           ========================================= */
        // Preview single tone
        document.getElementById('previewBtn').addEventListener('click', () => {
            playTonePattern(alarmToneSelect.value);
        });

        // Activate Alarm
        document.getElementById('setAlarmBtn').addEventListener('click', () => {
            unlockAudio();
            const timeVal = alarmTimeInput.value;
            if (!timeVal) {
                alert("براہ کرم الارم کا وقت منتخب کریں!");
                return;
            }

            const [hStr, mStr] = timeVal.split(':');
            const hours = parseInt(hStr, 10);
            const minutes = parseInt(mStr, 10);
            const msg = userNameInput.value.trim() || "Student Study & Focus Time!";
            const tone = alarmToneSelect.value;

            activeAlarm = {
                hours: hours,
                minutes: minutes,
                time24: timeVal,
                message: msg,
                tone: tone,
                triggered: false
            };

            document.getElementById('activeTimeText').textContent = format12Hour(hours, minutes);
            document.getElementById('activeMsgPreview').textContent = `Message: "${msg}"`;
            statusCard.style.display = 'flex';
            updateClock();
        });

        // Cancel Alarm
        document.getElementById('cancelAlarmBtn').addEventListener('click', () => {
            activeAlarm = null;
            statusCard.style.display = 'none';
        });

        // Test Full Alarm Immediately
        document.getElementById('testFullAlarmBtn').addEventListener('click', () => {
            unlockAudio();
            const now = new Date();
            const demoAlarm = {
                hours: now.getHours(),
                minutes: now.getMinutes(),
                message: userNameInput.value.trim() || "Ali - Time for Math Study!",
                tone: alarmToneSelect.value
            };
            triggerAlarm(demoAlarm);
        });

        // Trigger Ringing UI + Sound + Voice
        function triggerAlarm(alarmObj) {
            isRinging = true;
            document.getElementById('ringTimeDisplay').textContent = format12Hour(alarmObj.hours, alarmObj.minutes);
            document.getElementById('ringMessageDisplay').textContent = alarmObj.message;
            ringOverlay.classList.add('active');

            // Clear any old intervals
            clearInterval(toneInterval);
            clearInterval(speechInterval);

            // Play selected tone immediately & loop
            playTonePattern(alarmObj.tone);
            toneInterval = setInterval(() => {
                playTonePattern(alarmObj.tone);
            }, 1500);

            // Speak custom message via AI Voice
            speakMessage(alarmObj.message);
            speechInterval = setInterval(() => {
                speakMessage(alarmObj.message);
            }, 5000);
        }

        function speakMessage(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(`Attention! ${text}`);
                utterance.rate = 0.95;
                utterance.pitch = 1.05;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Dismiss / Stop Alarm
        document.getElementById('stopAlarmBtn').addEventListener('click', () => {
            isRinging = false;
            activeAlarm = null;
            clearInterval(toneInterval);
            clearInterval(speechInterval);
            ringOverlay.classList.remove('active');
            statusCard.style.display = 'none';
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        });

        /* =========================================
           4. AI NEURAL PARTICLE BACKGROUND
           ========================================= */
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.7;
                this.vy = (Math.random() - 0.5) * 0.7;
                this.radius = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00f3ff';
                ctx.fill();
            }
        }

        for (let i = 0; i < 55; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 243, 255, ${0.15 - dist / 800})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
